<!DOCTYPE html>
<html lang="en">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendar</title>
    <style>
/* Calendar Container */
        body {
           font-family: Arial, sans-serif;
           padding-top: 140px; 
        }
        .calendar-wrapper {
            background-color: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            width: 90%;
            max-width: 900px;
            margin: 40px auto;
        }

        /* Navigation */
        .nav {
            text-align: center;
            margin: 20px 0;
        }

        .nav a {
            margin: 0 15px;
            text-decoration: none;
            background-color: #196c92;
            padding: 8px 14px;
            border-radius: 10px;
            color: white;
            font-weight: bold;
        }

        .nav a:hover {
            background-color: #145377;
        }

        /* Calendar Table */
        table {
            width: 100%;
            border-collapse: collapse;
            background-color: white;
            border-radius: 12px;
            overflow: hidden;
        }

        th {
            background-color: #00CB8E;
            color: black;
            padding: 10px;
            font-size: 1.1em;
        }

        td {
            border: 1px solid #ddd;
            padding: 12px;
            height: 70px;
            vertical-align: top;
            background-color: #ffffff;
            transition: background-color 0.25s;
        }

        td:hover {
            background-color: #d4e9f5c2; /* Same light blue as search bar */
        }

        /* Highlight today's date */
        td.today {
            background-color: #00cb8e42;
            color: black;
            font-weight: bold;
        }

    </style>
    </head>
    <body>

    <header id="mainHeader">
    <div class="left-section">
      <a href="{{ url_for('index') }}" class="logo-link">
        <img src="{{ url_for('static', filename='images/logo.png') }}" alt="WebBeep Logo" class="logo" style="filter: drop-shadow(0 0 2px #79fcfcff);">
      </a>
    </div>

    <div class="right-section" style="display: flex; align-items: center; gap: 15px;">
      {% if current_user.is_authenticated %}
        <a href="{{ url_for('index') }}" class="profile-link">Home</a>
        <a href="{{ url_for('add_event') }}" class="profile-link">Add Event</a>
        <a href="{{ url_for('profile') }}" class="profile-link">Profile</a>
        <a href="{{ url_for('logout') }}" class="profile-link">Logout</a>
      {% else %}
        <a href="{{ url_for('index') }}" class="profile-link">Home</a>
        <a href="{{ url_for('login') }}" class="profile-link">Login</a>
        <a href="{{ url_for('register') }}" class="profile-link">Register</a>
      {% endif %}
    </div>
  </header>

        <div class = "nav">
            <a href = "/calendar/{{prev_year}}/{{prev_month}}">Previous</a>
            <a href="/calendar/{{ current_year }}/{{ current_month }}">Today</a>
            <a href = "/calendar/{{next_year}}/{{next_month}}">Next</a>
        </div>
        <div>
            {{ calendar|safe }}
        </div>
    </body>
</html>

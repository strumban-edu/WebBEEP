<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Event</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/favicon-32x32.png') }}">
  <style>
    .form-wrapper {
      max-width: 600px;
      margin: 220px auto 50px auto;
      background: white;
      padding: 30px 40px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      animation: slideUp 0.4s ease;
    }

    .form-wrapper h1 {
      text-align: center;
      margin-bottom: 25px;
      color: #333;
    }

    label {
      font-weight: bold;
      color: #444;
    }

    input, select {
      width: 100%;
      padding: 10px;
      margin-top: 6px;
      margin-bottom: 18px;
      border-radius: 10px;
      border: 1px solid #bbb;
      font-size: 1em;
    }

    button {
      width: 100%;
      padding: 12px;
      background-color: #2e8b57;
      color: white;
      border: none;
      border-radius: 15px;
      font-size: 1.2em;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    button:hover {
      background-color: #246b45;
    }

    .cancel-btn {
      display: inline-block;
      margin-top: 10px;
      width: 96%;
      text-align: center;
      padding: 12px;
      background-color: #555;
      color: white;
      text-decoration: none;
      border-radius: 15px;
      font-size: 1.2em;
      transition: background 0.3s ease;
    }
    .cancel-btn:hover {
      background-color: #333;
    }
  </style>
</head>
<body>

<header id="mainHeader">
  <div class="left-section">
    <a href="{{ url_for('index') }}" class="logo-link">
      <img src="{{ url_for('static', filename='images/logo.png') }}" alt="WebBeep Logo" class="logo" style="filter: drop-shadow(0 0 2px #79fcfcff);">
    </a>
  </div>

  <div class="right-section" style="display: flex; align-items: center; gap: 15px;">
    <a href="{{ url_for('index') }}" class="profile-link">Home</a>
  </div>
</header>

<div class="form-wrapper">
  <h1>Edit Event</h1>

  <form action="{{ url_for('edit_event', event_id=event.eventid) }}" method="POST">

    <label for="eventname">Event Name:</label>
    <input type="text" id="eventname" name="eventname" value="{{ event.eventname }}" required>

    <label for="category">Category:</label>
    <input type="text" id="category" name="category" value="{{ event.category }}" required>

    <label for="status">Status:</label>
    <select id="status" name="status" required>
      <option value="Complete" {% if event.status == "Complete" %}selected{% endif %}>Complete</option>
      <option value="Incomplete" {% if event.status == "Incomplete" %}selected{% endif %}>Incomplete</option>
    </select>

    <label for="eventtime">Time:</label>
    <input type="time" id="eventtime" name="eventtime"
      value="{{ event.eventtime.strftime('%H:%M') if event.eventtime else '' }}"
      required>

    <label for="location_name">Location:</label>
    <input type="text" id="location_name" name="location_name" value="{{ location.locationname }}" required>

    <button type="submit">Save Changes</button>
  </form>

  <a href="{{ url_for('index') }}" class="cancel-btn">Cancel</a>

</div>

<script>
const header = document.getElementById('mainHeader');
window.addEventListener('scroll', () => {
  header.classList.toggle('shrink', window.scrollY > 50);
});
</script>

</body>
</html>
